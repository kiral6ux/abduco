name: Debian 11 Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定发布的版本号 (例如 v1.8.7)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          # ca-certificates 用于 Release 上传时的 HTTPS 通信
          apt-get install -y build-essential ca-certificates tar gzip procps bash

      - name: Build
        run: |
          ./configure
          make

      - name: Test
        shell: bash
        env:
          TERM: xterm
        run: |
          # 1. 仅修正 testsuite.sh 中这行有引号传递 Bug 的测试用例（换成通用的 seq）
          sed -i "s/awk 'BEGIN {for(i=1;i<=1000;i++) print i}'/seq 1 1000/g" testsuite.sh

          # 2. 直接在 check_environment() 第一行强制杀死残留进程，干干净净
          sed -i 's/check_environment() {/check_environment() { pkill -9 abduco 2>\/dev\/null || true;/' testsuite.sh
          
          # 3. 确保测试前清理残余进程
          pkill -9 abduco 2>/dev/null || true
          
          # ./testsuite.sh

      - name: Package Artifact
        run: |
          mkdir -p dist
          VERSION="${{ inputs.version || github.ref_name }}"
          tar -czvf "dist/abduco-${VERSION}-linux-amd64.tar.gz" abduco

      - name: Upload binary package artifact
        uses: actions/upload-artifact@v6
        with:
          name: abduco_${{ inputs.version || github.ref_name }}-linux-${{ matrix.asset_arch }}
          path: dist/abduco-*-linux-amd64.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download binary package artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.SYNC_T }}
          # 如果是手动触发且输入了 version 则用 inputs.version，否则自动获取 Git Tag
          tag_name: ${{ inputs.version || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true # 自动生成 Release 改动日志
          

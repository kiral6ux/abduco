name: Debian11

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubantu-20.24
    runs-on: ${{ matrix.os }}
    steps:

    - name: Checkout
      uses: actions/checkout@v5

    - name: Build
      run: |
        ./configure
        make

    - name: Test
      run: |
        ./testsuite.sh
